<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arcade Hub</title>
<style>
body { margin:0; font-family:system-ui,sans-serif; background:#0b0f19; color:#f8fafc; }
header { background:#111827; padding:1.2rem 2rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; }
.logo { font-size:1.5rem; font-weight:800; color:#60a5fa; }
#search { padding:0.6rem 1rem; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; width:220px; }
.grid { max-width:1050px; margin:2rem auto; padding:0 1.5rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1.2rem; }
.card { background:#131a2a; border:1px solid #1e293b; border-radius:14px; overflow:hidden; cursor:pointer; transition:0.15s; }
.card:hover { transform:translateY(-4px); border-color:#3b82f6; }
.thumb { height:125px; display:flex; align-items:center; justify-content:center; font-size:3.2rem; }
.info { padding:1rem; }
.info h3 { margin:0 0 0.3rem; font-size:1.15rem; }
.info p { margin:0; color:#94a3b8; font-size:0.85rem; }
#player { display:none; position:fixed; inset:0; background:rgba(5,8,17,0.96); flex-direction:column; align-items:center; justify-content:center; z-index:99; }
.bar { width:90%; max-width:480px; display:flex; justify-content:space-between; align-items:center; margin-bottom:0.7rem; }
button { background:#3b82f6; color:#fff; border:none; padding:0.5rem 0.9rem; border-radius:8px; font-weight:600; cursor:pointer; }
canvas { background:#0f172a; border:2px solid #334155; border-radius:10px; }
#b2048 { display:grid; grid-template-columns:repeat(4,72px); gap:8px; background:#1e293b; padding:10px; border-radius:10px; }
.tile { width:72px; height:72px; border-radius:6px; background:#334155; display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:800; }
</style>
</head>
<body>
<header>
<div class="logo">🎮 ARCADE HUB</div>
<input id="search" placeholder="Search games..." oninput="render()" />
</header>
<div class="grid" id="grid"></div>
<div id="player">
<div class="bar">
<div><strong id="gtitle"></strong> <span id="score" style="margin-left:10px;color:#60a5fa">Score: 0</span></div>
<div><button onclick="launch(cur)">Restart</button> <button style="background:#334155" onclick="stop()">Exit</button></div>
</div>
<div id="stage"></div>
</div>
<script>
const GAMES = [
{id:'snake', name:'Neon Snake', icon:'🐍', bg:'#065f46', desc:'Arrow keys / WASD to eat & grow.'},
{id:'g2048', name:'2048', icon:'🔢', bg:'#b45309', desc:'Slide tiles with Arrow keys to hit 2048.'},
{id:'breakout', name:'Cyber Breakout', icon:'🧱', bg:'#1d4ed8', desc:'Move mouse to smash all neon bricks.'},
{id:'flappy', name:'Flappy Jet', icon:'🚀', bg:'#0369a1', desc:'Click or Spacebar to fly through pipes.'},
{id:'pong', name:'Hyper Pong', icon:'🏓', bg:'#be123c', desc:'Move mouse up/down to beat the AI.'}
];
let cur=null, loop=null, kh=null;
function render() {
const q = document.getElementById('search').value.toLowerCase();
document.getElementById('grid').innerHTML = GAMES.filter(g=>g.name.toLowerCase().includes(q)).map(g=>`
<div class="card" onclick="launch('${g.id}')">
<div class="thumb" style="background:${g.bg}">${g.icon}</div>
<div class="info"><h3>${g.name}</h3><p>${g.desc}</p></div>
</div>`).join('');
}
render();
function setS(s){ document.getElementById('score').textContent='Score: '+s; }
function stop(){ clearInterval(loop); cancelAnimationFrame(loop); if(kh) removeEventListener('keydown',kh); document.getElementById('player').style.display='none'; document.getElementById('stage').innerHTML=''; }
function launch(id){
stop(); cur=id; setS(0);
document.getElementById('gtitle').textContent = GAMES.find(g=>g.id===id).name;
document.getElementById('player').style.display='flex';
if(id==='snake') snake(); if(id==='g2048') g2048(); if(id==='breakout') breakout(); if(id==='flappy') flappy(); if(id==='pong') pong();
}
function snake(){
const c=document.createElement('canvas'); c.width=400; c.height=400; stage.appendChild(c);
const ctx=c.getContext('2d'), b=20; let s=[{x:200,y:200}], d='R', sc=0, f={x:100,y:100};
kh=e=>{ if(e.key==='ArrowLeft'&&d!=='R')d='L'; if(e.key==='ArrowUp'&&d!=='D')d='U'; if(e.key==='ArrowRight'&&d!=='L')d='R'; if(e.key==='ArrowDown'&&d!=='U')d='D'; };
addEventListener('keydown',kh);
loop=setInterval(()=>{
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,400,400); ctx.fillStyle='#f43f5e'; ctx.fillRect(f.x,f.y,18,18);
s.forEach((p,i)=>{ ctx.fillStyle=i?'#10b981':'#34d399'; ctx.fillRect(p.x,p.y,18,18); });
let x=s.x, y=s.y; if(d==='L')x-=b; if(d==='U')y-=b; if(d==='R')x+=b; if(d==='D')y+=b;
if(x<0||y<0||x>=400||y>=400||s.some(p=>p.x===x&&p.y===y)){ clearInterval(loop); alert('Game Over: '+sc); return; }
if(x===f.x&&y===f.y){ sc+=10; setS(sc); f={x:Math.floor(Math.random()20)b,y:Math.floor(Math.random()20)b}; } else s.pop();
s.unshift({x,y});
},110);
}
function g2048(){
const div=document.createElement('div'); div.id='b2048'; stage.appendChild(div);
let g=Array(16).fill(0), sc=0;
const add=()=>{ let e=g.map((v,i)=>v?null:i).filter(v=>v!==null); if(e.length) g[e[Math.floor(Math.random()e.length)]]=2; };
const draw=()=>{ div.innerHTML=g.map(v=>`<div class="tile" style="background:${v?'#2563eb':'#334155'}">${v||''}</div>`).join(''); setS(sc); };
const slide=r=>{ r=r.filter(v=>v); for(let i=0;i<r.length-1;i++) if(r[i]===r[i+1]){r[i]+=r[i];sc+=r[i];r[i+1]=0;} r=r.filter(v=>v); while(r.length<4)r.push(0); return r; };
kh=e=>{
let p=g.toString();
for(let i=0;i<4;i++){
if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ let r=[g[i4],g[i4+1],g[i4+2],g[i4+3]]; if(e.key==='ArrowRight')r.reverse(); r=slide(r); if(e.key==='ArrowRight')r.reverse(); for(let c=0;c<4;c++)g[i4+c]=r[c]; }
if(e.key==='ArrowUp'||e.key==='ArrowDown'){ let c=[g[i],g[i+4],g[i+8],g[i+12]]; if(e.key==='ArrowDown')c.reverse(); c=slide(c); if(e.key==='ArrowDown')c.reverse(); for(let r=0;r<4;r++)g[r4+i]=c[r]; }
}
if(p!==g.toString()){ add(); draw(); }
};
addEventListener('keydown',kh); add(); add(); draw();
}
function breakout(){
const c=document.createElement('canvas'); c.width=460; c.height=340; stage.appendChild(c);
const ctx=c.getContext('2d'); let x=230,y=280,dx=3,dy=-3,px=190,sc=0,br=[];
for(let r=0;r<4;r++) for(let col=0;col<7;col++) br.push({x:col63+12,y:r22+25,a:1});
c.onmousemove=e=>{ px=e.clientX-c.getBoundingClientRect().left-40; };
(function draw(){
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,460,340);
br.forEach(b=>{ if(b.a){ ctx.fillStyle='#3b82f6'; ctx.fillRect(b.x,b.y,56,15); }});
ctx.fillStyle='#fff'; ctx.fillRect(px,320,80,10); ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill();
if(x+dx>453||x+dx<7)dx=-dx; if(y+dy<7)dy=-dy; else if(y+dy>313){ if(x>px&&x<px+80)dy=-dy; else{alert('Game Over: '+sc);return;} }
br.forEach(b=>{ if(b.a&&x>b.x&&x<b.x+56&&y>b.y&&y<b.y+15){dy=-dy;b.a=0;sc+=10;setS(sc);} });
x+=dx; y+=dy; loop=requestAnimationFrame(draw);
})();
}
function flappy(){
const c=document.createElement('canvas'); c.width=340; c.height=440; stage.appendChild(c);
const ctx=c.getContext('2d'); let by=180,v=0,ps=[{x:340,t:130}],sc=0;
const flap=()=>{v=-6;}; c.onclick=flap; kh=e=>{if(e.code==='Space')flap();}; addEventListener('keydown',kh);
(function draw(){
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,340,440); v+=0.35; by+=v; ctx.fillStyle='#facc15'; ctx.fillRect(50,by,24,24);
if(ps[ps.length-1].x<170) ps.push({x:340,t:Math.random()200+40});
ps.forEach(p=>{ p.x-=2.5; ctx.fillStyle='#22c55e'; ctx.fillRect(p.x,0,42,p.t); ctx.fillRect(p.x,p.t+120,42,440); if(p.x===50){sc++;setS(sc);} if(74>p.x&&50<p.x+42&&(by<p.t||by+24>p.t+120))by=999; });
if(by>416||by<0){alert('Crashed: '+sc);return;} loop=requestAnimationFrame(draw);
})();
}
function pong(){
const c=document.createElement('canvas'); c.width=460; c.height=300; stage.appendChild(c);
const ctx=c.getContext('2d'); let py=115,ay=115,bx=230,by=150,dx=4,dy=3,sc=0;
c.onmousemove=e=>{ py=e.clientY-c.getBoundingClientRect().top-35; };
(function draw(){
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,460,300); ctx.fillStyle='#fff'; ctx.fillRect(10,py,10,70); ctx.fillRect(440,ay,10,70);
ctx.beginPath(); ctx.arc(bx,by,7,0,7); ctx.fill(); bx+=dx; by+=dy;
if(by<7||by>293)dy=-dy; ay+=(by-(ay+35))0.08;
if(bx<24&&by>py&&by<py+70){dx=Math.abs(dx)1.04;sc++;setS(sc);} if(bx>436&&by>ay&&by<ay+70)dx=-Math.abs(dx);
if(bx<0||bx>460){alert('Rally Score: '+sc);return;} loop=requestAnimationFrame(draw);
})();
}
</script>
</body>
</html>
