<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arcade Hub — Play Instantly</title>
<style>
:root {
--bg: #0b0f19;
--card: #131a2a;
--card-hover: #1b253b;
--accent: #3b82f6;
--accent2: #8b5cf6;
--text: #f8fafc;
--muted: #94a3b8;
}
{ box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: system-ui, -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
}
header {
background: linear-gradient(135deg, #111827, #1e1b4b);
padding: 1.5rem 2rem;
border-bottom: 1px solid #1e293b;
display: flex;
flex-wrap: wrap;
gap: 1rem;
justify-content: space-between;
align-items: center;
}
.logo {
font-size: 1.6rem;
font-weight: 800;
background: linear-gradient(90deg, #60a5fa, #c084fc);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
#search {
padding: 0.65rem 1rem;
border-radius: 10px;
border: 1px solid #334155;
background: #0f172a;
color: white;
width: 260px;
font-size: 0.95rem;
}
main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
gap: 1.25rem;
}
.card {
background: var(--card);
border: 1px solid #1e293b;
border-radius: 16px;
overflow: hidden;
cursor: pointer;
transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}
.card:hover {
transform: translateY(-4px);
background: var(--card-hover);
border-color: var(--accent);
}
.thumb {
height: 140px;
display: flex;
align-items: center;
justify-content: center;
font-size: 3.5rem;
}
.info { padding: 1.1rem; }
.tag {
display: inline-block;
font-size: 0.72rem;
text-transform: uppercase;
letter-spacing: 0.05em;
padding: 0.2rem 0.55rem;
border-radius: 6px;
background: rgba(59, 130, 246, 0.18);
color: #93c5fd;
margin-bottom: 0.45rem;
}
.info h3 { font-size: 1.2rem; margin-bottom: 0.3rem; }
.info p { color: var(--muted); font-size: 0.88rem; line-height: 1.4; }
/* Player Overlay /
#player {
display: none;
position: fixed;
inset: 0;
background: rgba(5, 8, 17, 0.95);
z-index: 100;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 1rem;
}
.bar {
width: 100%;
max-width: 520px;
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 0.75rem;
}
button {
background: var(--accent);
color: white;
border: none;
padding: 0.55rem 1rem;
border-radius: 8px;
font-weight: 600;
cursor: pointer;
}
button.secondary { background: #334155; }
canvas {
background: #0f172a;
border: 2px solid #334155;
border-radius: 12px;
max-width: 100%;
}
#board2048 {
display: grid;
grid-template-columns: repeat(4, 78px);
gap: 10px;
background: #1e293b;
padding: 12px;
border-radius: 12px;
}
.tile {
width: 78px;
height: 78px;
border-radius: 8px;
background: #334155;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.5rem;
font-weight: 800;
}
#controls-hint { margin-top: 0.65rem; color: var(--muted); font-size: 0.88rem; }
</style>
</head>
<body>
<header>
<div class="logo">🎮 ARCADE HUB</div>
<input id="search" type="text" placeholder="Search games..." oninput="filterGames()" />
</header>
<main>
<div class="grid" id="grid"></div>
</main>
<div id="player">
<div class="bar">
<div>
<strong id="game-title" style="font-size:1.2rem;">Game</strong>
<span id="score-box" style="margin-left:1rem;color:#60a5fa;font-weight:700;">Score: 0</span>
</div>
<div style="display:flex;gap:0.5rem;">
<button onclick="restartCurrent()">Restart</button>
<button class="secondary" onclick="closeGame()">✕ Exit</button>
</div>
</div>
<div id="stage"></div>
<div id="controls-hint"></div>
</div>
<script>
const GAMES = [
{ id: 'snake', title: 'Neon Snake', tag: 'Arcade', icon: '🐍', bg: 'linear-gradient(135deg,#065f46,#047857)', desc: 'Eat glowing orbs and grow without hitting walls or your tail.', hint: 'Use Arrow Keys or WASD to steer' },
{ id: 'g2048', title: '2048', tag: 'Puzzle', icon: '🔢', bg: 'linear-gradient(135deg,#b45309,#d97706)', desc: 'Slide numbered tiles to combine them and reach 2048.', hint: 'Use Arrow Keys or WASD to slide tiles' },
{ id: 'breakout', title: 'Cyber Breakout', tag: 'Retro', icon: '🧱', bg: 'linear-gradient(135deg,#1d4ed8,#4338ca)', desc: 'Smash through neon brick walls with your paddle and energy ball.', hint: 'Move mouse or Left/Right Arrow keys' },
{ id: 'flappy', title: 'Flappy Jet', tag: 'Action', icon: '🚀', bg: 'linear-gradient(135deg,#0369a1,#0284c7)', desc: 'Tap or press Space to fly through tight laser gates.', hint: 'Press Spacebar or Click to boost' },
{ id: 'tetris', title: 'Block Stacker', tag: 'Classic', icon: '🟦', bg: 'linear-gradient(135deg,#6d28d9,#7c3aed)', desc: 'Rotate and clear horizontal lines before the stack hits the top.', hint: 'Left/Right: Move | Up: Rotate | Down: Drop' },
{ id: 'pong', title: 'Hyper Pong', tag: 'Sports', icon: '🏓', bg: 'linear-gradient(135deg,#be123c,#e11d48)', desc: 'Beat the AI paddle in fast-paced futuristic table tennis.', hint: 'Move mouse up/down or use Up/Down arrows' }
];
let activeGame = null, loopId = null, keyHandler = null;
function renderGrid(list) {
document.getElementById('grid').innerHTML = list.map(g => `
<div class="card" onclick="launch('${g.id}')">
<div class="thumb" style="background:${g.bg}">${g.icon}</div>
<div class="info">
<span class="tag">${g.tag}</span>
<h3>${g.title}</h3>
<p>${g.desc}</p>
</div>
</div>
`).join('');
}
renderGrid(GAMES);
function filterGames() {
const q = document.getElementById('search').value.toLowerCase();
renderGrid(GAMES.filter(g => g.title.toLowerCase().includes(q) || g.tag.toLowerCase().includes(q)));
}
function setScore(s) { document.getElementById('score-box').textContent = 'Score: ' + s; }
function closeGame() {
cancelAnimationFrame(loopId);
clearInterval(loopId);
if (keyHandler) window.removeEventListener('keydown', keyHandler);
document.getElementById('player').style.display = 'none';
document.getElementById('stage').innerHTML = '';
}
function restartCurrent() { if (activeGame) launch(activeGame); }
function launch(id) {
closeGame();
activeGame = id;
const meta = GAMES.find(g => g.id === id);
document.getElementById('game-title').textContent = meta.title;
document.getElementById('controls-hint').textContent = meta.hint;
document.getElementById('player').style.display = 'flex';
setScore(0);
if (id === 'snake') startSnake();
if (id === 'g2048') start2048();
if (id === 'breakout') startBreakout();
if (id === 'flappy') startFlappy();
if (id === 'tetris') startTetris();
if (id === 'pong') startPong();
}
/* 1. SNAKE /
function startSnake() {
const c = document.createElement('canvas'); c.width = 400; c.height = 400;
document.getElementById('stage').appendChild(c);
const ctx = c.getContext('2d'), box = 20;
let snake = [{x: 10box, y: 10box}], dir = 'RIGHT', score = 0;
let food = {x: Math.floor(Math.random()20)box, y: Math.floor(Math.random()20)box};
keyHandler = e => {
if ((e.key==='ArrowLeft'||e.key==='a') && dir!=='RIGHT') dir='LEFT';
if ((e.key==='ArrowUp'||e.key==='w') && dir!=='DOWN') dir='UP';
if ((e.key==='ArrowRight'||e.key==='d') && dir!=='LEFT') dir='RIGHT';
if ((e.key==='ArrowDown'||e.key==='s') && dir!=='UP') dir='DOWN';
};
window.addEventListener('keydown', keyHandler);
loopId = setInterval(() => {
ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,400,400);
ctx.fillStyle = '#f43f5e'; ctx.fillRect(food.x, food.y, box-2, box-2);
snake.forEach((s,i) => { ctx.fillStyle = i===0 ? '#34d399' : '#10b981'; ctx.fillRect(s.x, s.y, box-2, box-2); });
let hx = snake[0].x, hy = snake[0].y;
if (dir==='LEFT') hx-=box; if (dir==='UP') hy-=box; if (dir==='RIGHT') hx+=box; if (dir==='DOWN') hy+=box;
if (hx<0 || hy<0 || hx>=400 || hy>=400 || snake.some(s=>s.x===hx && s.y===hy)) { clearInterval(loopId); alert('Game Over! Score: '+score); return; }
if (hx===food.x && hy===food.y) { score+=10; setScore(score); food={x:Math.floor(Math.random()20)box, y:Math.floor(Math.random()20)box}; }
else snake.pop();
snake.unshift({x:hx, y:hy});
}, 105);
}
/* 2. 2048 /
function start2048() {
const b = document.createElement('div'); b.id = 'board2048';
document.getElementById('stage').appendChild(b);
let grid = Array(16).fill(0), score = 0;
const colors = {0:'#334155',2:'#475569',4:'#64748b',8:'#d97706',16:'#ea580c',32:'#dc2626',64:'#e11d48',128:'#7c3aed',256:'#6d28d9',512:'#2563eb',1024:'#0284c7',2048:'#16a34a'};
function add() { const empty = grid.map((v,i)=>v===0?i:-1).filter(i=>i!==-1); if(empty.length) grid[empty[Math.floor(Math.random()empty.length)]] = Math.random()<0.9?2:4; }
function draw() { b.innerHTML = grid.map(v => `<div class="tile" style="background:${colors[v]||'#16a34a'}">${v||''}</div>`).join(''); setScore(score); }
function slide(row) {
let arr = row.filter(v=>v);
for (let i=0; i<arr.length-1; i++) if (arr[i]===arr[i+1]) { arr[i]=2; score+=arr[i]; arr[i+1]=0; }
arr = arr.filter(v=>v);
while (arr.length<4) arr.push(0);
return arr;
}
keyHandler = e => {
let prev = grid.toString();
if (['ArrowLeft','a','ArrowRight','d'].includes(e.key)) {
for (let r=0; r<4; r++) {
let row = [grid[r4],grid[r4+1],grid[r4+2],grid[r4+3]];
if (e.key==='ArrowRight'||e.key==='d') row.reverse();
row = slide(row);
if (e.key==='ArrowRight'||e.key==='d') row.reverse();
for (let c=0; c<4; c++) grid[r4+c] = row[c];
}
} else if (['ArrowUp','w','ArrowDown','s'].includes(e.key)) {
for (let c=0; c<4; c++) {
let col = [grid[c],grid[c+4],grid[c+8],grid[c+12]];
if (e.key==='ArrowDown'||e.key==='s') col.reverse();
col = slide(col);
if (e.key==='ArrowDown'||e.key==='s') col.reverse();
for (let r=0; r<4; r++) grid[r4+c] = col[r];
}
}
if (prev !== grid.toString()) { add(); draw(); }
};
window.addEventListener('keydown', keyHandler);
add(); add(); draw();
}
/* 3. BREAKOUT /
function startBreakout() {
const c = document.createElement('canvas'); c.width = 480; c.height = 360;
document.getElementById('stage').appendChild(c);
const ctx = c.getContext('2d');
let x=240, y=300, dx=3, dy=-3, padX=200, score=0;
const bricks = [];
for(let r=0;r<4;r++) for(let col=0;col<7;col++) bricks.push({x:col65+15, y:r24+30, alive:true});
c.onmousemove = e => { const rect = c.getBoundingClientRect(); padX = e.clientX - rect.left - 40; };
function draw() {
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,480,360);
bricks.forEach(b => { if(b.alive){ ctx.fillStyle='#3b82f6'; ctx.fillRect(b.x,b.y,58,16); }});
ctx.fillStyle='#f8fafc'; ctx.fillRect(padX,340,80,10);
ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI2); ctx.fillStyle='#38bdf8'; ctx.fill();
if(x+dx>473||x+dx<7) dx=-dx;
if(y+dy<7) dy=-dy;
else if(y+dy>333) {
if(x>padX && x<padX+80) dy=-dy;
else { alert('Game Over! Score: '+score); return; }
}
bricks.forEach(b => {
if(b.alive && x>b.x && x<b.x+58 && y>b.y && y<b.y+16) { dy=-dy; b.alive=false; score+=10; setScore(score); }
});
x+=dx; y+=dy;
loopId = requestAnimationFrame(draw);
}
draw();
}
/* 4. FLAPPY JET */
function startFlappy() {
const c = document.createElement('canvas'); c.width = 360; c.height = 480;
document.getElementById('stage').appendChild(c);
const ctx = c.getContext('2d');
let by=200, vel=0, pipes=[{x:360, top:140}], score=0;
const flap = () => { vel = -6.5; };
c.onclick = flap;
keyHandler = e => { if(e.code==='Space') flap(); };
window.addEventListener('keydown', keyHandler);
function draw() {
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,360,480);
vel += 0.35; by += vel;
ctx.fillStyle='#facc15'; ctx.fillRect(60, by, 26, 26);
if(pipes[pipes.length-1].x < 180) pipes.push({x:360, top:Math.random()*220+50});
pipes.forEach(p => {
p.x -= 2.5;
ctx.fillStyle='#22c55e';
ctx.fillRect(p.x, 0, 45, p.top);
ctx.fillRect(p.x, p.top+125, 45, 480);
if(p.x===60) { score++; setScore(score); }
if(60+26>p.x && 60<p.x+45 && (by<p.top || by+26>p.top+125)) by=999;
});
if(by>454 || by<0) { alert('Crashed! Score: '+score); return; }
loopId = requestAnimationFrame(draw);
}
draw();
}
/* 5. TETRIS */
function startTetris() {
const c = document.createElement('canvas'); c.width = 240; c.height = 400;
document.getElementById('stage').appendChild(c);
const ctx = c.getContext('2d'); ctx.scale(20,20);
const arena = Array.from({length:20},()=>Array(12).fill(0));
const pieces = [[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[4,4,0],[0,4,4]],[[0,5,5],[5,5,0]]];
const colors = [null,'#38bdf8','#facc15','#a855f7','#ef4444','#22c55e'];
let pos={x:4,y:0}, matrix=pieces[Math.floor(Math.random()*pieces.length)], score=0;
function collide() {
for(let y=0;y<matrix.length;y++) for(let x=0;x<matrix[y].length;x++)
if(matrix[y][x]!==0 && (arena[y+pos.y] && arena[y+pos.y][x+pos.x])!==0) return true;
return false;
}
function merge() { matrix.forEach((r,y)=>r.forEach((v,x)=>{ if(v) arena[y+pos.y][x+pos.x]=v; })); }
function sweep() {
for(let y=19;y>=0;y--) if(arena[y].every(v=>v!==0)) { arena.splice(y,1); arena.unshift(Array(12).fill(0)); score+=100; setScore(score); y++; }
}
function drop() {
pos.y++;
if(collide()) { pos.y--; merge(); sweep(); pos={x:4,y:0}; matrix=pieces[Math.floor(Math.random()*pieces.length)]; if(collide()) { clearInterval(loopId); alert('Game Over! Score: '+score); }}
}
keyHandler = e => {
if(e.key==='ArrowLeft'){ pos.x--; if(collide()) pos.x++; }
if(e.key==='ArrowRight'){ pos.x++; if(collide()) pos.x--; }
if(e.key==='ArrowDown') drop();
if(e.key==='ArrowUp'){ const rot=matrix[0].map((_,i)=>matrix.map(r=>r[i]).reverse()); const old=matrix; matrix=rot; if(collide()) matrix=old; }
};
window.addEventListener('keydown', keyHandler);
loopId = setInterval(() => {
drop();
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,12,20);
arena.forEach((r,y)=>r.forEach((v,x)=>{ if(v){ ctx.fillStyle=colors[v]; ctx.fillRect(x,y,0.92,0.92); }}));
matrix.forEach((r,y)=>r.forEach((v,x)=>{ if(v){ ctx.fillStyle=colors[v]; ctx.fillRect(x+pos.x,y+pos.y,0.92,0.92); }}));
}, 320);
}
/* 6. PONG /
function startPong() {
const c = document.createElement('canvas'); c.width = 480; c.height = 320;
document.getElementById('stage').appendChild(c);
const ctx = c.getContext('2d');
let py=120, ay=120, bx=240, by=160, dx=4, dy=3, score=0;
c.onmousemove = e => { const r = c.getBoundingClientRect(); py = e.clientY - r.top - 35; };
function draw() {
ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,480,320);
ctx.fillStyle='#f8fafc'; ctx.fillRect(10,py,10,70); ctx.fillRect(460,ay,10,70);
ctx.beginPath(); ctx.arc(bx,by,7,0,Math.PI2); ctx.fillStyle='#fb7185'; ctx.fill();
bx+=dx; by+=dy;
if(by<7||by>313) dy=-dy;
ay += (by - (ay+35)) * 0.08;
if(bx<24 && by>py && by<py+70) { dx=Math.abs(dx)*1.04; score++; setScore(score); }
if(bx>456 && by>ay && by<ay+70) dx=-Math.abs(dx);
if(bx<0 || bx>480) { alert('Point Ended! Rally Score: '+score); return; }
loopId = requestAnimationFrame(draw);
}
draw();
}
